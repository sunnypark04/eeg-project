[project]
name = "eeg-project"
version = "0.1.0"
description = "EEG motor imagery classification comparing full and reduced EEG channel sets"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "mne",
    "tqdm",
    "matplotlib",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]